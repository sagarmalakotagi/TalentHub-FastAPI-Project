{% extends "base.html" %}{% block title %}Student profile | TalentHub{% endblock %}{% block content %}
<div class="page-head"><div><span class="eyebrow">STUDENT PROFILE</span><h1>Your details</h1><p>Keep your academic details up to date for eligibility checks.</p></div><a class="btn secondary" href="/dashboard">← Dashboard</a></div>
<form class="panel form-panel profile-form" method="post" action="/profile"><label>Branch</label><input name="branch" value="{{ student.branch }}" required><label>CGPA (out of 10)</label><input type="number" name="cgpa" min="0" max="10" step=".01" value="{{ student.cgpa }}" required><label>Active backlogs</label><input type="number" name="backlogs" min="0" value="{{ student.backlogs }}" required><button class="btn primary">Save profile</button></form>{% endblock %}
